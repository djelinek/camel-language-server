name: Main branch - Sonar analysis, signing and deploying

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: 17
        distribution: 'temurin'
        cache: 'maven'
        gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
        gpg-passphrase: MAVEN_GPG_PASSPHRASE # env variable for passphrase in sign and deploy
        server-id: central
        server-username: MAVEN_CENTRAL_USERNAME # env variable for username in deploy
        server-password: MAVEN_CENTRAL_TOKEN # env variable for token in deploy
    - name: Cache SonarCloud packages
      uses: actions/cache@v6.1.0
      with:
        path: ~/.sonar/cache
        key: ${{ runner.os }}-sonar
        restore-keys: ${{ runner.os }}-sonar
    - name: Verify credentials
      env:
        MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
        MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
      run: |
        echo "=== settings.xml structure (values masked) ==="
        sed 's|>.*<|>***<|g' ~/.m2/settings.xml

        echo ""
        echo "=== Environment variables ==="
        if [ -z "$MAVEN_CENTRAL_USERNAME" ]; then echo "❌ MAVEN_CENTRAL_USERNAME is EMPTY"; else echo "✅ MAVEN_CENTRAL_USERNAME is set (${#MAVEN_CENTRAL_USERNAME} chars)"; fi
        if [ -z "$MAVEN_CENTRAL_TOKEN" ]; then echo "❌ MAVEN_CENTRAL_TOKEN is EMPTY"; else echo "✅ MAVEN_CENTRAL_TOKEN is set (${#MAVEN_CENTRAL_TOKEN} chars)"; fi

        echo ""
        echo "=== Direct auth test via curl ==="
        HTTP_CODE=$(curl -s -o /tmp/response.txt -w "%{http_code}" -u "$MAVEN_CENTRAL_USERNAME:$MAVEN_CENTRAL_TOKEN" "https://central.sonatype.com/repository/maven-snapshots/com/github/camel-tooling/camel-lsp-server/maven-metadata.xml")
        echo "Sonatype HTTP response: $HTTP_CODE"
        if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "404" ]; then
          echo "Response body:"
          cat /tmp/response.txt
        fi
    - name: Build and deploy (debug)
      run: |
        set -o pipefail
        mvn -P sign,build-extras -B deploy -DskipTests 2>&1 | tee /tmp/mvn-output.txt
        echo "Maven exit code: $?"
      env:
        MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
        MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
    - name: Show deploy details on failure
      if: failure()
      run: |
        echo "=== Last 50 lines of Maven output ==="
        tail -50 /tmp/mvn-output.txt
        echo ""
        echo "=== All lines mentioning central.sonatype.com ==="
        grep -i "central.sonatype" /tmp/mvn-output.txt || echo "(none found)"
